<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Calculator</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .calculator {
      width: 100%;
      max-width: 380px;
      height: 100vh;
      max-height: 750px;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px 10px;
    }

    .app-title {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .history-toggle-btn {
      background: #334155;
      color: #38bdf8;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .display {
      text-align: right;
      padding: 10px 14px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 120px;
      word-break: break-all;
    }

    .sub-display {
      font-size: 18px;
      color: #94a3b8;
      min-height: 24px;
      margin-bottom: 6px;
    }

    .main-display {
      font-size: 46px;
      font-weight: 400;
      color: #ffffff;
      line-height: 1.1;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-bottom: 8px;
    }

    button.btn {
      aspect-ratio: 1;
      border-radius: 20px;
      border: none;
      font-size: 24px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.15s, transform 0.1s;
    }

    button.btn:active {
      opacity: 0.7;
      transform: scale(0.95);
    }

    .btn-num {
      background: #334155;
      color: #f8fafc;
    }

    .btn-action {
      background: #334155;
      color: #f87171;
    }

    .btn-op {
      background: #0284c7;
      color: #ffffff;
      font-size: 26px;
    }

    .btn-equal {
      background: #10b981;
      color: #ffffff;
      font-size: 30px;
    }

    .history-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      z-index: 10;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s ease-in-out;
    }

    .history-panel.active {
      transform: translateY(0);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 18px;
      font-weight: 600;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 22px;
      cursor: pointer;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding-right: 4px;
    }

    .history-item {
      padding: 12px 10px;
      border-bottom: 1px solid #1e293b;
      text-align: right;
      cursor: pointer;
      border-radius: 8px;
    }

    .history-item:active {
      background: #1e293b;
    }

    .history-calc {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .history-result {
      font-size: 22px;
      color: #38bdf8;
      font-weight: 600;
    }

    .history-empty {
      text-align: center;
      color: #64748b;
      margin-top: 40px;
      font-size: 15px;
    }

    .clear-history-btn {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="top-bar">
      <span class="app-title">Calculator</span>
      <button class="history-toggle-btn" onclick="toggleHistory(true)">🕒 History</button>
    </div>

    <div class="display">
      <div class="sub-display" id="subDisplay"></div>
      <div class="main-display" id="mainDisplay">0</div>
    </div>

    <div class="keypad">
      <button class="btn btn-action" onclick="allClear()">AC</button>
      <button class="btn btn-action" onclick="deleteLast()">⌫</button>
      <button class="btn btn-action" onclick="appendOperator('%')">%</button>
      <button class="btn btn-op" onclick="appendOperator('÷')">÷</button>

      <button class="btn btn-num" onclick="appendNumber('7')">7</button>
      <button class="btn btn-num" onclick="appendNumber('8')">8</button>
      <button class="btn btn-num" onclick="appendNumber('9')">9</button>
      <button class="btn btn-op" onclick="appendOperator('×')">×</button>

      <button class="btn btn-num" onclick="appendNumber('4')">4</button>
      <button class="btn btn-num" onclick="appendNumber('5')">5</button>
      <button class="btn btn-num" onclick="appendNumber('6')">6</button>
      <button class="btn btn-op" onclick="appendOperator('-')">-</button>

      <button class="btn btn-num" onclick="appendNumber('1')">1</button>
      <button class="btn btn-num" onclick="appendNumber('2')">2</button>
      <button class="btn btn-num" onclick="appendNumber('3')">3</button>
      <button class="btn btn-op" onclick="appendOperator('+')">+</button>

      <button class="btn btn-num" onclick="toggleSign()">±</button>
      <button class="btn btn-num" onclick="appendNumber('0')">0</button>
      <button class="btn btn-num" onclick="appendDot()">.</button>
      <button class="btn btn-equal" onclick="calculate()">=</button>
    </div>

    <div class="history-panel" id="historyPanel">
      <div class="history-header">
        <span class="history-title">History</span>
        <button class="close-btn" onclick="toggleHistory(false)">✕</button>
      </div>
      <div class="history-list" id="historyList"></div>
      <button class="clear-history-btn" onclick="clearHistory()">Clear History</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousExpression = '';
    let isEvaluated = false;
    let history = JSON.parse(localStorage.getItem('calc_history') || '[]');

    const mainDisplay = document.getElementById('mainDisplay');
    const subDisplay = document.getElementById('subDisplay');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');

    function updateDisplay() {
      mainDisplay.innerText = currentInput;
      subDisplay.innerText = previousExpression;
    }

    function appendNumber(num) {
      if (isEvaluated) {
        currentInput = num;
        previousExpression = '';
        isEvaluated = false;
      } else {
        if (currentInput === '0') {
          currentInput = num;
        } else {
          currentInput += num;
        }
      }
      updateDisplay();
    }

    function appendDot() {
      if (isEvaluated) {
        currentInput = '0.';
        previousExpression = '';
        isEvaluated = false;
        updateDisplay();
        return;
      }
      const parts = currentInput.split(/[\+\-\×\÷]/);
      const lastPart = parts[parts.length - 1];
      if (!lastPart.includes('.')) {
        currentInput += '.';
        updateDisplay();
      }
    }

    function appendOperator(op) {
      isEvaluated = false;
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '×', '÷', '%'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }
      updateDisplay();
    }

    function allClear() {
      currentInput = '0';
      previousExpression = '';
      isEvaluated = false;
      updateDisplay();
    }

    function deleteLast() {
      if (isEvaluated) {
        allClear();
        return;
      }
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentInput === '0') return;
      if (currentInput.startsWith('-')) {
        currentInput = currentInput.slice(1);
      } else {
        currentInput = '-' + currentInput;
      }
      updateDisplay();
    }

    function calculate() {
      if (isEvaluated) return;
      try {
        let expression = currentInput
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/%/g, '/100');

        let result = Function('"use strict";return (' + expression + ')')();
        result = Math.round(result * 100000000) / 100000000;

        saveHistory(currentInput, result);

        previousExpression = currentInput + ' =';
        currentInput = result.toString();
        isEvaluated = true;
        updateDisplay();
      } catch (e) {
        currentInput = 'Error';
        isEvaluated = true;
        updateDisplay();
      }
    }

    function saveHistory(calc, res) {
      history.unshift({ calc, res });
      if (history.length > 30) history.pop();
      localStorage.setItem('calc_history', JSON.stringify(history));
    }

    function renderHistory() {
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">No calculations yet</div>';
        return;
      }

      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div class="history-calc">${item.calc} =</div>
          <div class="history-result">${item.res}</div>
        `;
        div.onclick = () => {
          currentInput = item.res.toString();
          previousExpression = item.calc + ' =';
          isEvaluated = true;
          updateDisplay();
          toggleHistory(false);
        };
        historyList.appendChild(div);
      });
    }

    function toggleHistory(show) {
      if (show) {
        renderHistory();
        historyPanel.classList.add('active');
      } else {
        historyPanel.classList.remove('active');
      }
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem('calc_history');
      renderHistory();
    }

    /* PWA Service Worker Registration */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
